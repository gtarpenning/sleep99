name: TestFlight

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
  workflow_dispatch:
    inputs:
      release_notes:
        description: "TestFlight changelog"
        required: false
        default: "Manual build"

concurrency:
  group: testflight
  cancel-in-progress: false

jobs:
  build:
    name: Build & Upload
    runs-on: self-hosted
    timeout-minutes: 60
    permissions:
      contents: write

    steps:
      - name: Disable osxkeychain credential helper
        run: git config --global credential.helper ""

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: SSH agent (match certs repo)
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.MATCH_DEPLOY_KEY }}

      - name: Ruby + Bundler
        run: |
          export PATH="/opt/homebrew/opt/ruby@3.3/bin:/opt/homebrew/bin:$PATH"
          gem install bundler --no-document 2>/dev/null || true
          bundle install --jobs 4 --retry 3

      - name: Build keychain
        # Self-hosted runner. Sign from a dedicated keychain whose password we
        # know, so match can grant codesign key access without a GUI prompt
        # (signing from the login keychain fails with errSecInternalComponent).
        # Only this keychain is searched during the job; restored below.
        run: |
          KC=~/Library/Keychains/build.keychain-db
          security create-keychain -p "" build.keychain 2>/dev/null || true
          security unlock-keychain -p "" build.keychain
          security set-keychain-settings -lut 21600 build.keychain
          security list-keychains -d user -s "$KC"
          security default-keychain -s ~/Library/Keychains/login.keychain-db

      - name: Configure git credentials
        run: |
          git config --global url."https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/".insteadOf "https://github.com/"
          git config --global user.name "ci-bot"
          git config --global user.email "ci@sleep-tune.app"

      - name: Fastlane beta
        env:
          ASC_KEY_ID:       ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID:    ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_CONTENT:  ${{ secrets.ASC_KEY_CONTENT }}
          MATCH_PASSWORD:   ${{ secrets.MATCH_PASSWORD }}
          MATCH_KEYCHAIN_NAME: build.keychain
          MATCH_KEYCHAIN_PASSWORD: ""
          MATCH_GIT_URL:    git@github.com:gtarpenning/sleep-tune-certs.git
          RELEASE_NOTES:    ${{ github.event.inputs.release_notes || format('commit {0}', github.sha) }}
          GIT_AUTHOR_NAME:     "ci-bot"
          GIT_AUTHOR_EMAIL:    "ci@sleep-tune.app"
          GIT_COMMITTER_NAME:  "ci-bot"
          GIT_COMMITTER_EMAIL: "ci@sleep-tune.app"
        run: |
          export PATH="/opt/homebrew/opt/ruby@3.3/bin:/opt/homebrew/bin:$PATH"
          bundle exec fastlane beta

      - name: Restore keychain search list
        if: always()
        run: |
          security list-keychains -d user -s ~/Library/Keychains/login.keychain-db ~/Library/Keychains/build.keychain-db
          security default-keychain -s ~/Library/Keychains/login.keychain-db

      - name: Upload IPA (debug artifact)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SleepTune-${{ github.run_number }}.ipa
          path: build_output/SleepTune.ipa
          retention-days: 7
